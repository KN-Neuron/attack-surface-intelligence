[package]
name = "attack-surface-intelligence"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
bcrypt = "0.15"
chrono = "0.4"
cookie = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "fs"] }
uuid = { version = "1", features = ["v4"] }
